name: Build and test

on:
  push:
    branches:
      - feature/platform-baseline-and-media-security
      - feature/login-rate-limiting
  pull_request:
    branches:
      - main
      - feature/platform-baseline-and-media-security

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Verify toolchain
        run: dotnet --info

      - name: Restore dependencies (NuGet audit enabled)
        run: dotnet restore Asancode.sln --verbosity minimal

      - name: Report direct and transitive NuGet vulnerabilities
        run: dotnet package list --project Asancode.sln --include-transitive --vulnerable --format json --no-restore

      - name: Build solution
        run: dotnet build Asancode.sln --configuration Release --no-restore --verbosity minimal

      - name: Run automated tests
        run: dotnet test Asancode.sln --configuration Release --no-build --verbosity minimal

  windows-image-tests:
    name: Windows native image processing tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Restore image test dependencies
        run: dotnet restore Asancode.Tests/Asancode.Tests.csproj --verbosity minimal

      - name: Build and run image processor tests
        run: dotnet test Asancode.Tests/Asancode.Tests.csproj --configuration Release --no-restore --verbosity minimal -- --filter-class Asancode.Tests.ImageUploadProcessorTests

  linux-preview-publish:
    name: Build Linux x64 self-contained preview artifact
    needs:
      - build
      - windows-image-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Restore Linux x64 runtime assets
        run: dotnet restore Asancode.Web/Asancode.Web.csproj --runtime linux-x64 --verbosity minimal

      - name: Publish self-contained Linux x64 application
        run: >
          dotnet publish Asancode.Web/Asancode.Web.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --no-restore
          --verbosity minimal
          --output "$RUNNER_TEMP/lms-preview"

      - name: Write source manifest
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            printf 'Repository: %s\n' "$GITHUB_REPOSITORY"
            printf 'Source ref: %s\n' "$SOURCE_REF"
            printf 'Source commit: %s\n' "$SOURCE_SHA"
            printf 'Target: linux-x64 (self-contained)\n'
            printf 'Purpose: temporary preview smoke test; not production\n'
          } > "$RUNNER_TEMP/lms-preview/PREVIEW-BUILD.txt"

      - name: Upload temporary preview artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lms-preview-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/lms-preview/
          if-no-files-found: error
          retention-days: 3
