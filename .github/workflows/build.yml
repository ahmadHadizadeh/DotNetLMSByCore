name: Build

on:
  push:
    branches:
      - feature/platform-baseline-and-media-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Verify toolchain
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore Asancode.sln --verbosity minimal

      - name: Build solution
        run: dotnet build Asancode.sln --configuration Release --no-restore --verbosity minimal
