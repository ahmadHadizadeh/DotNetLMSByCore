name: Build and test

on:
  push:
    branches:
      - feature/platform-baseline-and-media-security
  pull_request:
    branches:
      - main
      - feature/platform-baseline-and-media-security

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Verify toolchain
        run: dotnet --info

      - name: Restore dependencies (NuGet audit enabled)
        run: dotnet restore Asancode.sln --verbosity minimal

      - name: Report direct and transitive NuGet vulnerabilities
        run: dotnet package list --project Asancode.sln --include-transitive --vulnerable --format json --no-restore

      - name: Build solution
        run: dotnet build Asancode.sln --configuration Release --no-restore --verbosity minimal

      - name: Run automated tests
        run: dotnet test Asancode.sln --configuration Release --no-build --verbosity minimal

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.15

      - name: Generate SQL upgrade script from the deployed baseline
        env:
          ConnectionStrings__AsanCodeConnection: "Server=localhost;Database=Asancode_MigrationScriptDesignTime;User Id=sa;Password=NotARealPassword!2026;TrustServerCertificate=True"
        run: |
          mkdir -p artifacts
          dotnet ef migrations script 20260218105211_mig1_FirstDb 20261121130000_SeedWalletTypes \
            --context AsanwebContext \
            --project DataLayer/DataLayer.csproj \
            --startup-project Asancode.Web/Asancode.Web.csproj \
            --configuration Release \
            --output artifacts/database-upgrade-from-mig1.sql

      - name: Upload database upgrade script
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-upgrade-from-mig1
          path: artifacts/database-upgrade-from-mig1.sql
          if-no-files-found: error
          retention-days: 14

  windows-image-tests:
    name: Windows native image processing tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Restore image test dependencies
        run: dotnet restore Asancode.Tests/Asancode.Tests.csproj --verbosity minimal

      - name: Build and run image processor tests
        run: dotnet test Asancode.Tests/Asancode.Tests.csproj --configuration Release --no-restore --verbosity minimal -- --filter-class Asancode.Tests.ImageUploadProcessorTests
